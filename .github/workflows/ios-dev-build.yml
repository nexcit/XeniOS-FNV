# iOS dev build for a personal XeniOS fork.
#
# Builds an ad-hoc-signed IPA on a GitHub macOS runner using XeniOS's own
# tools/build_apple_release.sh (no official signing/attestation keys needed),
# then publishes it to a rolling pre-release called "dev-latest" so the IPA
# can be downloaded straight from Safari on the iPhone and opened in SideStore.
#
# Trigger from Claude Code:   gh workflow run ios-dev-build.yml --ref <branch>
# Or automatically:           push to any branch named dev/...

name: iOS dev build

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What this build is testing (shown in the release notes)"
        required: false
        default: ""
  push:
    branches:
      - "dev/**"

concurrency:
  group: ios-dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bundle ID baked into the IPA. SideStore appends your team ID when it signs.
  #  - "com.xenios.dev": installs NEXT TO the official XeniOS app (separate
  #    Documents folder, so copy games into it). Uses one extra app slot.
  #  - "com.xenios.jp": installs OVER the official XeniOS app and keeps its
  #    games/config. Use this if you're at the free-account app limit.
  IOS_BUNDLE_ID: "com.xenios.dev"

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same dependency setup as upstream .github/workflows/apple-publish.yml
      - name: Set up Apple build dependencies
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then return 1; fi
              sleep 5
            done
          }
          brew install ninja ccache
          retry git submodule update --init --depth=1 --recursive -j"$(sysctl -n hw.ncpu)"
          retry git -C third_party/DirectXShaderCompiler submodule update --init --depth=1 \
            external/SPIRV-Headers external/SPIRV-Tools
          ./xenia-build.py fetchdata

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Ensure Metal toolchain
        shell: bash
        run: |
          if xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal toolchain already present"; exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then exit 0; fi
            echo "::warning::MetalToolchain download attempt $attempt failed"
            sleep $((attempt * 30))
          done
          echo "::error::MetalToolchain download failed"; exit 1

      # Build caches. Runs can restore caches from their own branch or from
      # the default branch, so a workflow_dispatch build on xenios warms them
      # for every dev/** branch.
      #  - ccache for C/C++ compiles. CMake's compiler launchers don't apply
      #    to the Xcode generator, so XCODE_XCCONFIG_FILE sets Xcode's own
      #    C_COMPILER_LAUNCHER instead (the host Ninja build uses CMake's).
      #  - The prebuilt libdxilconv.dylib (nested DXC/LLVM build, ~10 min).
      #  - CMake configure results (~7 min of feature checks with Xcode).
      - name: Set up build caches
        id: cache-setup
        shell: bash
        run: |
          set -euo pipefail
          ccache_dir="${RUNNER_TEMP}/ccache"
          sloppiness="pch_defines,time_macros,include_file_mtime,include_file_ctime,modules,clang_index_store,ivfsoverlay,system_headers"
          mkdir -p "$ccache_dir"
          {
            echo "CCACHE_DIR=${ccache_dir}"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_SLOPPINESS=${sloppiness}"
            echo "CCACHE_MAXSIZE=2G"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

          # Xcode doesn't reliably pass the job environment to compiler
          # invocations, so the launcher carries absolute paths and settings.
          # Modules and response files are off: ccache can't cache them, and
          # XeniOS doesn't use clang modules.
          wrapper_dir="${RUNNER_TEMP}/ccache-xcode"
          mkdir -p "$wrapper_dir"
          {
            echo '#!/bin/sh'
            echo "export CCACHE_DIR='${ccache_dir}' CCACHE_BASEDIR='${GITHUB_WORKSPACE}'"
            echo "export CCACHE_SLOPPINESS='${sloppiness}' CCACHE_MAXSIZE=2G"
            echo "exec '$(command -v ccache)' \"\$@\""
          } > "${wrapper_dir}/ccache-launcher"
          chmod +x "${wrapper_dir}/ccache-launcher"
          {
            echo "C_COMPILER_LAUNCHER = ${wrapper_dir}/ccache-launcher"
            echo "CXX_COMPILER_LAUNCHER = ${wrapper_dir}/ccache-launcher"
            echo "CLANG_ENABLE_MODULES = NO"
            echo "CLANG_USE_RESPONSE_FILE = NO"
            echo "COMPILER_INDEX_STORE_ENABLE = NO"
          } > "${wrapper_dir}/ccache.xcconfig"
          echo "XCODE_XCCONFIG_FILE=${wrapper_dir}/ccache.xcconfig" >> "$GITHUB_ENV"

          short_hash() { shasum -a 256 | cut -c1-16; }
          toolchain="$({ xcodebuild -version; cmake --version | head -1; uname -m; } | short_hash)"
          # CMake's checks depend on the build files and every submodule.
          cmake_inputs="$({ git ls-files -s | awk -F'\t' '$2 ~ /(^|\/)CMakeLists\.txt$|\.cmake$|^CMakePresets\.json$|^xenia-build\.py$/'; git ls-tree -r HEAD third_party | awk '$1 == "160000"'; } | short_hash)"
          dxilconv_inputs="$({ git ls-tree HEAD third_party/DirectXShaderCompiler third_party/DirectX-Headers; git ls-files -s CMakeLists.txt third_party/CMakeLists.txt; } | short_hash)"
          {
            echo "toolchain=${toolchain}"
            echo "cmake=${cmake_inputs}"
            echo "dxilconv=${dxilconv_inputs}"
          } >> "$GITHUB_OUTPUT"
          echo "Toolchain ${toolchain}, CMake inputs ${cmake_inputs}, dxilconv inputs ${dxilconv_inputs}"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ios-${{ steps.cache-setup.outputs.toolchain }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-ios-${{ steps.cache-setup.outputs.toolchain }}-${{ github.ref_name }}-
            ccache-ios-${{ steps.cache-setup.outputs.toolchain }}-

      - name: Restore prebuilt dxilconv
        id: dxilconv-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/DirectXShaderCompiler/build_dxilconv_ios/lib/libdxilconv.dylib
          key: dxilconv-ios-${{ steps.cache-setup.outputs.toolchain }}-${{ steps.cache-setup.outputs.dxilconv }}

      - name: Restore CMake configure results
        id: cmake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/[0-9]*
            build-ios-xcode/CMakeCache.txt
            build-ios-xcode/CMakeFiles/[0-9]*
          key: cmake-ios-${{ steps.cache-setup.outputs.toolchain }}-${{ steps.cache-setup.outputs.cmake }}

      # The checkout is newer than the restored dylib, which would make the
      # dxilconv custom command rebuild it from scratch.
      - name: Mark restored dxilconv as up to date
        if: steps.dxilconv-cache.outputs.cache-hit == 'true'
        run: touch third_party/DirectXShaderCompiler/build_dxilconv_ios/lib/libdxilconv.dylib

      - name: Build IPA
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats
          ./tools/build_apple_release.sh \
            --config release \
            --channel preview \
            --stage alpha \
            --ios-bundle-id "${IOS_BUNDLE_ID}" \
            --skip-macos-arm64 --skip-macos-x86_64 --skip-macos-universal
          short_sha="$(git rev-parse --short HEAD)"
          mkdir -p out
          cp scratch/artifacts/xenios_ios_iphone_ipad.ipa "out/XeniOS-dev-${short_sha}.ipa"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      - name: Compiler cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ios-${{ steps.cache-setup.outputs.toolchain }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save prebuilt dxilconv
        if: always() && steps.dxilconv-cache.outputs.cache-hit != 'true' && hashFiles('third_party/DirectXShaderCompiler/build_dxilconv_ios/lib/libdxilconv.dylib') != ''
        uses: actions/cache/save@v4
        with:
          path: third_party/DirectXShaderCompiler/build_dxilconv_ios/lib/libdxilconv.dylib
          key: dxilconv-ios-${{ steps.cache-setup.outputs.toolchain }}-${{ steps.cache-setup.outputs.dxilconv }}

      - name: Save CMake configure results
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true' && hashFiles('build-ios-xcode/CMakeCache.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/[0-9]*
            build-ios-xcode/CMakeCache.txt
            build-ios-xcode/CMakeFiles/[0-9]*
          key: cmake-ios-${{ steps.cache-setup.outputs.toolchain }}-${{ steps.cache-setup.outputs.cmake }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XeniOS-dev-${{ env.SHORT_SHA }}
          path: out/XeniOS-dev-${{ env.SHORT_SHA }}.ipa
          retention-days: 7

      # Only dev/** builds replace the IPA; xenios builds just warm the caches.
      - name: Publish rolling "dev-latest" pre-release
        if: startsWith(github.ref, 'refs/heads/dev/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          set -euo pipefail
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          {
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${SHORT_SHA}"
            echo "Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if [ -n "${NOTE}" ]; then echo; echo "Testing: ${NOTE}"; fi
            echo
            git log -5 --format='- %h %s'
          } > notes.md
          # Fixed file name so the phone can always use the same download link.
          cp "out/XeniOS-dev-${SHORT_SHA}.ipa" out/XeniOS-dev.ipa
          gh release create dev-latest out/XeniOS-dev.ipa \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Dev build ${SHORT_SHA} (${GITHUB_REF_NAME})" \
            --notes-file notes.md
          echo "IPA: https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/XeniOS-dev.ipa" >> "$GITHUB_STEP_SUMMARY"
